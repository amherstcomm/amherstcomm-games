# Every commit answers five questions: does it typecheck, does it lint, do
# the rules still hold (unit), is the feed still the feed (contract), and
# does the site still work in a browser at WCAG A/AA (e2e). The e2e job stubs
# every network the app talks to, so a red run is ours, never an outage's.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# One run per branch, whichever event asked for it last.
#
# push and pull_request both fire on the same commit, so every PR was running
# the whole suite twice — two ten-minute browser jobs for one commit, and two
# of every line in `gh pr checks`. Grouping on head_ref for a PR and ref_name
# for a push produces the same string for both ("dev"), so they land in one
# group and the later one cancels the earlier. It also kills the run for a
# commit you have already pushed past, which is most of them on a busy branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repository. Without this
# block a workflow gets the default token scope, which is wider than it
# needs and is the blast radius if a step ever runs something hostile.
permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, unit, contract, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run build

  # Split three ways. The suite is ten minutes of browser on one runner and
  # nothing about it is sequential — every test stubs its own network and
  # brings its own storage — so thirds run at the same time for the same total
  # work and a third of the wait. fail-fast is off because a failure in one
  # shard says nothing about the other two, and finding out about all three at
  # once beats three trips.
  e2e:
    name: browser + WCAG
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # one name per shard, or the second upload fails on a taken name
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
