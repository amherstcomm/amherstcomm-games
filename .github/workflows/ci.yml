# Every commit answers five questions: does it typecheck, does it lint, do
# the rules still hold (unit), is the feed still the feed (contract), and
# does the site still work in a browser at WCAG A/AA (e2e). The e2e job stubs
# every network the app talks to, so a red run is ours, never an outage's.
name: CI

# Push only, deliberately.
#
# With `pull_request` as well, both events fired on the same commit and the
# suite ran twice — two ten-minute browser jobs for one push. A concurrency
# group covering both was not enough: the run that loses is marked cancelled,
# but the work already dispatched carries on, and a cancelled run still posts
# its checks, so the duplication both continued and went on looking untouched.
#
# Dropping the trigger removes the second run rather than racing it. Nothing is
# lost by it: check runs attach to a commit, not to an event, so a
# push-triggered run appears on any pull request whose head is that commit.
# Development happens on `dev` here and a release is a pull request from it, so
# every commit that could be reviewed has already been pushed and checked — and
# it keeps the signal while the work is happening, which is the half that
# matters when a branch takes twenty commits before it takes a PR.
#
# What this gives up is a pull request from a fork, where no push event reaches
# us. There is one maintainer. If that changes, `pull_request` comes back, and
# this paragraph is the reason it was ever gone.
on:
  push:
    branches: ['**']

# One run per branch. A commit already pushed past does not need its tests
# finished, and on a branch like this one that is most of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repository. Without this
# block a workflow gets the default token scope, which is wider than it
# needs and is the blast radius if a step ever runs something hostile.
permissions:
  contents: read

jobs:
  # The quick half: a minute, and the answer to most pushes.
  checks:
    name: typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  # The contract tests run the real puzzle generator -- thirty-odd runs of
  # half a minute to a minute each -- and were nine to eleven minutes of the
  # ten-to-twelve-minute wait, all on the one runner behind the quick checks.
  # Split three ways by hand rather than by vitest's --shard, which deals out
  # files without knowing that two of them are a third of the work each: every
  # group here has one of the heavy files and some of the light ones, measured
  # (on a laptop, one at a time) at roughly three to four and a half minutes
  # of generator each. A new contract file has to be added to a group, or it
  # does not run -- the last step below fails the job when one is missing.
  contract:
    name: contract (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: themed
            files: >-
              tests/contract/themed-daily.test.ts
              tests/contract/publish-day.test.ts
              tests/contract/preflight.test.ts
              tests/contract/check-timers.test.ts
          - group: round days
            files: >-
              tests/contract/publish-rounds-daily.test.ts
              tests/contract/generator.test.ts
              tests/contract/preview.test.ts
          - group: publishing
            files: >-
              tests/contract/drain-publish-requests.test.ts
              tests/contract/publish-rounds.test.ts
              tests/contract/seed-salt.test.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project contract ${{ matrix.files }}
      # Every contract file is in exactly one group above. Checked once, in
      # the first group, so a file added later and forgotten here fails a run
      # rather than silently never running.
      - if: matrix.group == 'themed'
        run: |
          listed="themed-daily publish-day preflight check-timers publish-rounds-daily generator preview drain-publish-requests publish-rounds seed-salt"
          missing=0
          for f in tests/contract/*.test.ts; do
            name=$(basename "$f" .test.ts)
            case " $listed " in *" $name "*) ;; *) echo "::error file=$f::$f is in no contract group in ci.yml"; missing=1 ;; esac
          done
          exit $missing

  # Split three ways. The suite is ten minutes of browser on one runner and
  # nothing about it is sequential — every test stubs its own network and
  # brings its own storage — so thirds run at the same time for the same total
  # work and a third of the wait. fail-fast is off because a failure in one
  # shard says nothing about the other two, and finding out about all three at
  # once beats three trips.
  e2e:
    name: browser + WCAG
    runs-on: ubuntu-latest
    # Playwright's own image, the browser and everything it needs already in
    # it: installing them was twenty to forty-seven seconds of every shard,
    # and on 2026-10-21 the install itself failed and took a green run red.
    # The tag is the version package.json pins -- they must move together,
    # or the test runner looks for a browser build the image does not have.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # one name per shard, or the second upload fails on a taken name
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
