# Every commit answers five questions: does it typecheck, does it lint, do
# the rules still hold (unit), is the feed still the feed (contract), and
# does the site still work in a browser at WCAG A/AA (e2e). The e2e job stubs
# every network the app talks to, so a red run is ours, never an outage's.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: typecheck, lint, unit, contract, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run build

  e2e:
    name: browser + WCAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
