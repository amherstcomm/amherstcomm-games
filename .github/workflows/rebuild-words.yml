# Rebuilds the word lists end to end: band files, domains map, CSV, and the
# Postgres words table, all from one derivation, so no consumer can drift
# from another. Dispatch it after amending a flag list or bumping a source
# package.
#
# It takes two dispatches, and that is deliberate. The client only accepts a
# CDN band whose embedded version matches, and the bundled fallback has to ship
# in the same commit the tag points at — so the tag cannot be created until the
# rebuilt files are actually on the branch. main is protected, so they get there
# by pull request:
#
#   dispatch -> opens a PR with whatever changed, creates no tag
#   merge it
#   dispatch again -> nothing left to change, so it tags
#
# The database load needs SUPABASE_DB_URL (the session-pooler connection
# string, Dashboard -> Connect) as a repo secret; without it the workflow
# still rebuilds the files and says what it skipped. It is idempotent — one
# transaction that truncates and reloads — so the second dispatch is harmless.
name: Rebuild word lists

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the band files (e.g. words-v2). Also created as a git tag.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build lists, bands and CSV
        env:
          WORDS_VERSION: ${{ inputs.version }}
        run: node scripts/build-words.mjs
      - name: Refresh the blocklist too — same sources, same run
        run: node scripts/blocklist.mjs
      - name: Load Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL not set; files rebuilt but the database was not reloaded"
            exit 0
          fi
          node -e "
            const j = require('./scripts/blocked-words.json');
            const esc = (s) => String(s).replace(/'/g, \"''\");
            const vals = j.words.map((w) => \`('\${esc(w.word)}','\${esc(w.scope)}','\${esc(w.origin)}')\`).join(',');
            console.log(\`insert into public.blocked_words (word, scope, origin) values \${vals};\`);
          " > /tmp/blocked-insert.sql
          # one session, one transaction: either the whole reload lands or
          # none of it does — a half-truncated words table would fail every
          # membership check on the site
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          truncate public.words;
          \copy public.words (word, len, sorted, level, pos, lemma, flag, domains) from 'scripts/words.csv' with (format csv, header true, null '')
          truncate public.blocked_words;
          \i /tmp/blocked-insert.sql
          commit;
          SQL
      - name: Open a PR for whatever changed
        id: rebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/wordbands scripts/blocked-words.json
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "The files on ${{ github.ref_name }} already are this build."
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          branch="words/${{ inputs.version }}"
          git checkout -b "$branch"
          git commit -m "Rebuild word lists (${{ inputs.version }})"
          git push -f origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.ref_name }}" --head "$branch" \
              --title "Rebuild word lists (${{ inputs.version }})" \
              --body "Rebuilt by the Rebuild word lists workflow.

          Merge this, then dispatch the workflow again with the same version to create the \`${{ inputs.version }}\` tag. The tag has to point at the commit that ships the bundled fallback, so it cannot be created before this lands."
          fi
      - name: Tag — only once the branch already is the build
        if: steps.rebuilt.outputs.changed == 'no'
        run: |
          # The tagged CDN URL is cached forever, so a tag that already exists
          # must never be moved: a moved tag serves the old files to everyone
          # who cached it and the new ones to everyone who did not.
          existing=$(git ls-remote origin "refs/tags/${{ inputs.version }}" | cut -f1)
          head=$(git rev-parse HEAD)
          if [ "$existing" = "$head" ]; then
            echo "Already tagged."
            exit 0
          fi
          if [ -n "$existing" ]; then
            echo "::error::${{ inputs.version }} already exists at $existing but this build is $head. Pick a new version rather than moving a tag the CDN has cached."
            exit 1
          fi
          git tag "${{ inputs.version }}"
          git push origin "refs/tags/${{ inputs.version }}"
      - name: Say why there is no tag yet
        if: steps.rebuilt.outputs.changed == 'yes'
        run: echo "::notice::Opened a PR with the rebuilt files. No tag yet — merge it, then dispatch again with the same version."
