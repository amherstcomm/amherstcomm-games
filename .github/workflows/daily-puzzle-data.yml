# Fetches the NYT puzzles for the solver autofill buttons and generates our
# own daily game content (guess words per length, daily hive), publishing
# everything to the puzzle-data branch.
name: Daily puzzle data

on:
  schedule:
    # NYT publishes Letter Boxed and Spelling Bee at 3:00 a.m. Eastern. Cron
    # is UTC-only, so run at both candidate offsets: 07:15 UTC is 3:15 a.m.
    # EDT and 08:15 UTC is 3:15 a.m. EST — whichever matches the season
    # fetches the fresh puzzles, and the other run harmlessly re-fetches.
    - cron: '15 7 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/fetch-puzzles.mjs
        env:
          # No database credentials here, and none possible: Supabase answers on
          # the internal network and a hosted runner is not on it. So this run
          # publishes the *unthemed* file feed, which is the fallback the client
          # uses when the RPC does not answer.
          #
          # The themed puzzles come from the VM — ops/publish-puzzles.sh, whose
          # rows the client reads first. A themed month lives there, not here,
          # and a workflow that pretended otherwise would publish thirty-one
          # ordinary days over the top of it.
          PUZZLES_SEED_SALT: ${{ secrets.PUZZLES_SEED_SALT }}
      - name: Publish a fortnight of rows to Postgres
        # rows for today through +13, behind an RPC that never serves past
        # today — outage insurance nobody can ask for. Skips politely until
        # the secret exists, and a failure here must not stop the branch
        # publish below — that's today's live feed.
        env:
          # Kept for a deployment whose Supabase is reachable from GitHub, which
          # this one's is not — the step below skips politely without them.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUZZLES_SEED_SALT: ${{ secrets.PUZZLES_SEED_SALT }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not set; skipping Postgres publish"
          else
            node scripts/publish-window.mjs || echo "::warning::Postgres publish failed; file feed unaffected"
          fi
      - name: Publish to puzzle-data branch
        # orphan branch holding only the data files — keeping workflow files
        # out of it so the default GITHUB_TOKEN can always push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan puzzle-data
          git add -f data/*.json
          git commit -m "Update NYT puzzle data"
          git push -f origin puzzle-data
