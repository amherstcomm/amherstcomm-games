# Fetches the NYT puzzles for the solver autofill buttons and generates our
# own daily game content (guess words per length, daily hive), publishing
# everything to the puzzle-data branch.
name: Daily puzzle data

on:
  schedule:
    # NYT publishes Letter Boxed and Spelling Bee at 3:00 a.m. Eastern. Cron
    # is UTC-only, so run at both candidate offsets: 07:15 UTC is 3:15 a.m.
    # EDT and 08:15 UTC is 3:15 a.m. EST — whichever matches the season
    # fetches the fresh puzzles, and the other run harmlessly re-fetches.
    - cron: '15 7 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node scripts/fetch-puzzles.mjs
      - name: Publish to Postgres
        # second home for the same data: rows behind an RPC that never serves
        # tomorrow. Skips politely until the secret exists, and a failure here
        # must not stop the branch publish below — that's today's live feed.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not set; skipping Postgres publish"
          else
            node scripts/publish-puzzles.mjs || echo "::warning::Postgres publish failed; file feed unaffected"
          fi
      - name: Publish to puzzle-data branch
        # orphan branch holding only the data files — keeping workflow files
        # out of it so the default GITHUB_TOKEN can always push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan puzzle-data
          git add -f data/*.json
          git commit -m "Update NYT puzzle data"
          git push -f origin puzzle-data
