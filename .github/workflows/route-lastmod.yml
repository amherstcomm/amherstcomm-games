# The sitemap's <lastmod> dates are committed rather than computed at build
# time, because Render builds without usable git history — the first version
# computed them with `git log` and shipped 33 URLs and no dates at all.
#
# So something has to keep the committed file current, and it shouldn't be
# anyone's memory. This does it on the working branch rather than on main: by
# the time a PR merges the file is already right, so production still deploys
# once. A bot commit on main would land after Render had started building and
# cost a second deploy every merge.
#
# It can't loop. The dates describe source files, so committing the JSON
# doesn't change them — a second run computes the same values and commits
# nothing. The paths filter means the bot's own commit doesn't even trigger it.
name: Update sitemap lastmod

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'scripts/route-lastmod.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # full history: the script computes dates from it and refuses to run
      # against a shallow clone, which is the whole reason this job exists
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/route-lastmod.mjs
      - name: Commit if the dates moved
        run: |
          if git diff --quiet -- scripts/route-lastmod.json; then
            echo "already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/route-lastmod.json
          git commit -m "Update sitemap lastmod dates"
          git push origin HEAD:${GITHUB_REF_NAME}
