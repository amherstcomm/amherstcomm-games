name: Fetch Letter Boxed puzzle

on:
  schedule:
    # NYT publishes Letter Boxed at 3:00 a.m. Eastern. Cron is UTC-only, so
    # run at both candidate offsets: 07:15 UTC is 3:15 a.m. EDT and 08:15 UTC
    # is 3:15 a.m. EST — whichever matches the season fetches the fresh
    # puzzle, and the other run harmlessly re-fetches the same data.
    - cron: '15 7 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-letterboxed.mjs
      - name: Publish to puzzle-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B puzzle-data
          git add -f data/letterboxed.json
          git commit -m "Update Letter Boxed puzzle data"
          git push -f origin puzzle-data
