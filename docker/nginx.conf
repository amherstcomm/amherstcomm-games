# The two rules render.yaml set, and nothing more: every route rewrites to
# index.html so the client router can read it, and hashed assets cache for a
# year because their names change when their contents do.
#
# There is deliberately no /wordbands/ rule. The bands are pulled in with
# import.meta.glob, so they build to name-hashed files under /assets/ like
# everything else — a rule for the source path would never match a request.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No version number in the Server header. Free, and one less thing telling
    # a scanner which nginx CVEs to try.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Name-hashed, so the filename changes whenever the bytes do and a cached
    # copy can never be stale. This is also where the word bands land.
    # No `expires 1y` alongside this: that directive emits its own
    # Cache-Control, and the response went out carrying two of them — measured,
    # not guessed. add_header alone says everything, `immutable` included.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html carries the references to every hashed asset, so caching it is
    # exactly how a deploy fails to take effect. Never store it.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The SPA rewrite. Any path that is not a real file is a client route, and
    # the router in index.html resolves it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
