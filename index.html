<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anagrimoire — Word Game Solver</title>
    <meta
      name="description"
      content="Solve Wordle, crosswords, and hangman puzzles. Lock in known letters, list the ones you've seen, exclude the rest — Anagrimoire finds every word that fits."
    />

    <!-- Link preview card, for when a result gets pasted into a chat.
         1200x630 because that's what Facebook and LinkedIn crop to — a square
         logo loses its top and bottom there. Regenerate with
         scripts/make-og-image.ps1. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anagrimoire" />
    <meta property="og:title" content="Anagrimoire — word game solvers and daily puzzles" />
    <meta
      property="og:description"
      content="Seven word games to play daily and seven solvers to crack the ones that beat you: guess, scramble, hive, grid, boxed, weave, and word squares."
    />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Anagrimoire logo beside the words: word game solvers and daily puzzles"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Stamp the saved theme before first paint, so a light-mode visitor
      // never sees a flash of the dark palette (or vice versa).
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('anagrimoire:v1') || '{}');
          var mode = s.theme || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          var pal = s.palette === 'cvd' ? 'deuter' : s.palette;
          root.setAttribute(
            'data-palette',
            ['deuter', 'tritan', 'mono'].indexOf(pal) >= 0 ? pal : 'default'
          );
          root.style.colorScheme = dark ? 'dark' : 'light';
          var scales = { normal: '100%', large: '112.5%', larger: '125%' };
          if (scales[s.textScale]) root.style.fontSize = scales[s.textScale];
        } catch (e) {
          /* first visit, or storage unavailable — the app applies it on mount */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
