<!-- Supabase Magic Link template. Paste into Authentication -> Emails ->
     Magic Link (requires custom SMTP). Suggested subject:
     Your Anagrimoire sign-in link -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#f1f5f9;padding:32px 16px;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:440px;background-color:#0f172a;border-radius:16px;padding:36px 32px;font-family:Georgia,'Times New Roman',serif;">
        <tr>
          <td align="center" style="padding-bottom:6px;">
            <span style="font-size:26px;font-weight:bold;color:#ffffff;">Anagrimoire</span>
            <span style="font-size:20px;color:#fbbf24;">&#10022;</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <span style="font-size:13px;color:#94a3b8;font-family:Arial,Helvetica,sans-serif;">Word games, solved and played</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="font-size:15px;line-height:1.6;color:#cbd5e1;font-family:Arial,Helvetica,sans-serif;">
              Here's your sign-in link. It works once and expires in an hour.
            </span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#fbbf24;color:#0f172a;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;text-decoration:none;padding:13px 34px;border-radius:10px;">
              Sign in to Anagrimoire
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <span style="font-size:13px;color:#94a3b8;font-family:Arial,Helvetica,sans-serif;">
              Or enter this code on the sign-in screen:
            </span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:30px;">
            <span style="display:inline-block;background-color:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 22px;font-family:'Courier New',Courier,monospace;font-size:24px;letter-spacing:6px;color:#fbbf24;">{{ .Token }}</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="border-top:1px solid #1e293b;padding-top:22px;">
            <span style="font-size:12px;line-height:1.6;color:#64748b;font-family:Arial,Helvetica,sans-serif;">
              Didn't request this? You can safely ignore this email —<br>
              no one can sign in without it.
            </span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:18px;">
            <a href="https://anagrimoire.com" style="font-size:12px;color:#64748b;font-family:Arial,Helvetica,sans-serif;text-decoration:underline;">anagrimoire.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
