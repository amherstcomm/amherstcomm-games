services:
  - type: web
    name: anagrimoire
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '20'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # hashed assets are immutable; cache them for a year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
